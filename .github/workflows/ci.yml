name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -m 'not services' --cov=transaction_pipeline --cov-report=xml --junitxml=artifacts/unit.xml
      - run: python scripts/demo_failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-python-${{ matrix.python }}
          path: |
            artifacts/
            coverage.xml
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres s3
      - run: python scripts/integration.py
      - run: docker compose run --build --rm pipeline run --source s3 --fail-db 2 --fail-s3 2
      - name: Vérifier le second passage
        run: |
          docker compose run --rm -T pipeline process --source s3 > result.json
          python -c 'import json; r=json.load(open("result.json")); assert r["inserted"]==0 and r["skipped"]==2 and r["transactions"]==12'
      - name: Journaux des services
        if: always()
        run: mkdir -p artifacts && docker compose logs --no-color > artifacts/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-services
          path: artifacts/
      - run: docker compose down -v
        if: always()
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
  deploy:
    needs: [quality, integration, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Préparer SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Déployer le commit validé
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          git archive --format=tar HEAD | gzip > release.tar.gz
          scp release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/transaction-pipeline/release.tar.gz"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          cd /opt/transaction-pipeline
          tar -xzf release.tar.gz
          bash deploy/deploy.sh
          REMOTE
